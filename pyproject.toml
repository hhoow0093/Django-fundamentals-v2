[project]
name = "02-fundamental-of-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "google-genai>=2.31.0",
    "django-extensions>=4.1",
    "ipython>=9.17.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "django-debug-toolbar>=8.0.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

# Development

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["mysite"]
extend-exclude = [".github/**"]
force-exclude = true

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["mysite"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "mysite.settings"

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".github"]
skips = []          # e.g. ["B101"] if you use assert in src
