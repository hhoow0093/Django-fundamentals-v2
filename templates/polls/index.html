{% load static %}
<body>
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <link rel="stylesheet" href="{% static 'polls/polls.css' %}">
    <ul>
        {% for question in questions %}
            <li><a href="{% url "polls:detail" question.id %}">{{ question.id }}</a> : {{ question }} : {{ question.published_date }} : {{ question.was_published_recently }} </li>
        {% empty %}
            <li>No questions are found</li>
        {% endfor %}
    </ul>
    <script src="{%static 'polls/polls.js' %}" defer></script>
</body>
