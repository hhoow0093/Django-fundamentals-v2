minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -c pyproject.toml
        language: system
        types: [python]
        exclude: '(^|/)tests?(/|\.py$)'
      - id: mypy
        name: mypy
        entry: uv run --locked mypy --config-file=pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        require_serial: true
