name: lint

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: github-actions-test-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed so the base SHA exists locally

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Copy CI settings file
        run: cp mysite/local_settings.ci.py mysite/local_settings.py

      # Ruff and Bandit process changed files; mypy always checks the configured project files.
      - name: Run hooks on changed files
        if: github.event_name == 'pull_request'
        run: |
          uv run --locked pre-commit run \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref ${{ github.event.pull_request.head.sha }} \
            --show-diff-on-failure --color always

      # Pushes to main: full run as a safety net (catches cross-file mypy issues)
      - name: Run hooks on all files
        if: github.event_name == 'push'
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure --color always

      - name: Copy CI settings file
        run: cp mysite/local_settings.ci.py mysite/local_settings.py

      - name: Run Django checks and tests
        run: |
          uv run --locked python manage.py check
          uv run --locked python manage.py test
